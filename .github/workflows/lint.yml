name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($results) { exit 1 }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\Reset-ClaudeDesktop.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
